name: Build DiscordChatRelay DLL

on:
  push:
    paths:
      - "CppMod/**"
      - ".github/workflows/build-dll.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WICHTIG: RE-UE4SS hat ein privates Submodul (Unreal-Pseudocode).
      # Dafuer muss:
      #  1. Dein GitHub-Account mit einem Epic-Games-Account verknuepft sein
      #     (https://www.unrealengine.com/en-US/ue-on-github) und die Einladung
      #     in die EpicGames-Org angenommen sein
      #  2. Ein Personal Access Token (classic, Scope "repo") als Repo-Secret
      #     EPIC_GITHUB_TOKEN hinterlegt sein (Settings -> Secrets -> Actions)
      - name: Clone RE-UE4SS (inkl. privater UE-Submodule)
        env:
          GH_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GH_TOKEN)) {
            Write-Host "::error::Das Repo-Secret EPIC_GITHUB_TOKEN fehlt! Anlegen unter: Settings -> Secrets and variables -> Actions -> New repository secret. Wert: ein GitHub PAT (classic, Scope 'repo') eines Accounts, der mit Epic Games verknuepft ist."
            exit 1
          }
          git config --global url."https://x-access-token:$($env:GH_TOKEN)@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:$($env:GH_TOKEN)@github.com/".insteadOf "git@github.com:"
          git clone --recursive --depth 1 --shallow-submodules https://github.com/UE4SS-RE/RE-UE4SS.git CppMod/RE-UE4SS
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Klonen fehlgeschlagen. Pruefe: 1) PAT gueltig + Scope 'repo'? 2) Epic-Einladung in die EpicGames-GitHub-Org angenommen? (E-Mail von GitHub nach der Verknuepfung)"
            exit 1
          }

      - name: Install Rust (von UE4SS benoetigt)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S CppMod -B CppMod/build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64

      - name: Build
        run: cmake --build CppMod/build --target DiscordChatRelay

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DiscordChatRelay-dll
          path: CppMod/build/**/main.dll
